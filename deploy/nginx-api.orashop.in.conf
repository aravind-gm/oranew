# ============================================================================
# ORA JEWELLERY — NGINX REVERSE PROXY CONFIG (Phase 5)
# ============================================================================
#
# Place at: /etc/nginx/sites-available/api.orashop.in
# Symlink:  ln -s /etc/nginx/sites-available/api.orashop.in /etc/nginx/sites-enabled/
#
# Features:
#   ✓ Reverse proxy to PM2 cluster (localhost:5000)
#   ✓ Gzip compression
#   ✓ Keepalive upstream connections
#   ✓ WebSocket support (for future use)
#   ✓ Rate limiting (nginx layer — defense in depth)
#   ✓ Proper proxy headers (X-Real-IP, X-Forwarded-*)
#   ✓ Security headers
#   ✓ SSL via Certbot (configured separately)
#   ✓ Razorpay webhook path bypass (no rate limit)
#   ✓ Large body for file uploads
#
# After placing this file:
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================================

# ── Rate Limiting Zones ──
# General API: 20 req/s per IP with burst
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Auth endpoints: 5 req/s (login, register, OTP)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# Checkout: 2 req/s (high-value, must be strict)
limit_req_zone $binary_remote_addr zone=api_checkout:10m rate=2r/s;

# ── Upstream (PM2 cluster with keepalive) ──
upstream ora_backend {
    server 127.0.0.1:5000;
    keepalive 32;  # Persistent connections to Node.js
}

# ── HTTP → HTTPS Redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name api.orashop.in;

    # Let Certbot handle ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (Main) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.orashop.in;

    # ── SSL (Certbot will fill these in) ──
    # ssl_certificate /etc/letsencrypt/live/api.orashop.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.orashop.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── SSL Hardening ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security Headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Hide Nginx version ──
    server_tokens off;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Client Body Limits ──
    # Default: 1MB (enough for JSON API calls)
    client_max_body_size 1m;

    # ── Timeouts ──
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    send_timeout 30s;

    # ── Common Proxy Headers ──
    # These are inherited by all location blocks below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";  # Enable keepalive to upstream

    # ======================================================================
    # ROUTE-SPECIFIC BLOCKS
    # ======================================================================

    # ── Razorpay Webhook (NO RATE LIMIT — must never be blocked) ──
    # Razorpay retries on failure; blocking = lost payment confirmations
    location /api/payments/webhook {
        # No rate limiting for webhooks
        proxy_pass http://ora_backend;
        proxy_read_timeout 30s;
        
        # Pass raw body (required for HMAC signature verification)
        proxy_set_header Content-Type $content_type;
        
        # Log webhook hits for debugging
        access_log /var/log/nginx/webhook.access.log;
    }

    # ── Auth Routes (stricter rate limit) ──
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ora_backend;
    }

    # ── Checkout Routes (strictest rate limit) ──
    location /api/orders/checkout {
        limit_req zone=api_checkout burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://ora_backend;
    }

    location /api/orders/guest-checkout {
        limit_req zone=api_checkout burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://ora_backend;
    }

    # ── Upload Routes (larger body limit) ──
    location /api/upload {
        client_max_body_size 10m;
        limit_req zone=api_general burst=5 nodelay;
        proxy_pass http://ora_backend;
    }

    location /api/r2 {
        client_max_body_size 10m;
        limit_req zone=api_general burst=5 nodelay;
        proxy_pass http://ora_backend;
    }

    # ── Health Check (no rate limit, fast) ──
    location /api/health {
        proxy_pass http://ora_backend;
        access_log off;
    }

    location /health {
        proxy_pass http://ora_backend;
        access_log off;
    }

    # ── All Other API Routes ──
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://ora_backend;
    }

    # ── Root ──
    location / {
        proxy_pass http://ora_backend;
    }

    # ── Block dotfiles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom Error Pages ──
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"success":false,"error":"Service temporarily unavailable. Please try again."}';
    }

    # ── Logging ──
    access_log /var/log/nginx/api.orashop.in.access.log;
    error_log /var/log/nginx/api.orashop.in.error.log warn;
}
